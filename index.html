<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>쿠팡! - MLB BIG A 운동화 특가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --cp-red: #E31A22;
      --cp-blue: #0073E9;
      --cp-bg: #F0F0F0;
      --cp-dark: #111111;
      --cp-gray: #777777;
      --cp-gold: #FFA400;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--cp-bg);
      color: var(--cp-dark);
      overflow-x: hidden;
    }

    /* =========================================
       1. COUPANG TOP BAR & SEARCH
       ========================================= */
    .coupang-top-header {
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #EAEAEA;
    }

    .top-search-row {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
    }

    .cp-logo-text {
      font-size: 22px;
      font-weight: 900;
      color: var(--cp-red);
      letter-spacing: -1px;
      text-decoration: none;
    }

    .cp-search-bar {
      flex: 1;
      position: relative;
    }

    .cp-search-bar input {
      width: 100%;
      height: 38px;
      border: 2px solid var(--cp-red);
      border-radius: 4px;
      padding: 0 34px 0 12px;
      font-size: 13px;
      font-weight: 500;
      outline: none;
    }

    .cp-search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--cp-red);
    }

    .cp-cart-icon {
      font-size: 22px;
      color: #333;
    }

    .cp-nav-tabs {
      display: flex;
      background: #FFFFFF;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid #E5E5E5;
      padding: 0 8px;
    }
